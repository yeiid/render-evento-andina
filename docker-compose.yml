version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: render-evento-andina
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - andina_data:/app/backend/data
    restart: unless-stopped

volumes:
  andina_data:
