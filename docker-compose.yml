version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: render-evento-andina
    ports:
      - "3010:3010"
    expose:
      - "3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
    volumes:
      - andina_data:/app/backend/data
    networks:
      - default
      - dokploy-network
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
    name: dokploy-network

volumes:
  andina_data:
