version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: render-evento-andina
    expose:
      - "3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
    volumes:
      - andina_data:/app/backend/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.render-andina.rule=Host(`render.neuraljira.tech`)"
      - "traefik.http.routers.render-andina.entrypoints=websecure"
      - "traefik.http.routers.render-andina.tls=true"
      - "traefik.http.routers.render-andina.tls.certresolver=letsencrypt"
      - "traefik.http.services.render-andina.loadbalancer.server.port=3010"
    networks:
      - default
      - dokploy-network
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
    name: dokploy-network

volumes:
  andina_data:
